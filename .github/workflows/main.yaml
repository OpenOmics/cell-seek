name: tests

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
  pull_request:
    branches_ignore: []

permissions:
  contents: read
  packages: read

jobs:
  Dry_Run_and_Lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install Apptainer
      run: |
        sudo add-apt-repository -y ppa:apptainer/ppa
        sudo apt-get update
        sudo apt-get install -y apptainer
    - name: Install Snakemake
      run: pip install "snakemake>=7,<8" "pulp<2.8"
    - name: Dry Run with test data
      run: |
        ./cell-seek run --input \
        .tests/WT_S1_L001_R1_001.fastq.gz .tests/WT_S1_L001_R2_001.fastq.gz \
        .tests/WT_S2_L001_R1_001.fastq.gz .tests/WT_S2_L001_R2_001.fastq.gz \
        .tests/WT_S3_L001_R1_001.fastq.gz .tests/WT_S3_L001_R2_001.fastq.gz \
        .tests/WT_S4_L001_R1_001.fastq.gz .tests/WT_S4_L001_R2_001.fastq.gz \
        --output output --genome hg38 --pipeline gex --cellranger 8.0.1 --mode local --dry-run
    - name: View the pipeline config file
      run: |
        echo "Generated config file for pipeline...." && cat $PWD/output/config.json
    - name: Lint Workflow
      continue-on-error: true
      run: |
        snakemake --lint -s output/workflow/Snakefile -d output || \
        echo 'There may have been a few warnings or errors. Please read through the log to determine if its harmless.'
  Dry_Run_and_Lint_cellranger:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install Apptainer
      run: |
        sudo add-apt-repository -y ppa:apptainer/ppa
        sudo apt-get update
        sudo apt-get install -y apptainer
    - name: Install Snakemake
      run: pip install "snakemake>=7,<8" "pulp<2.8"
    - name: Dry Run with test data
      run: |
        ./cell-seek run --input \
        .tests/WT/ \
        --output output --genome hg38 --pipeline gex --cellranger 8.0.1 --mode local --dry-run
    - name: View the pipeline config file
      run: |
        echo "Generated config file for pipeline...." && cat $PWD/output/config.json
    - name: Lint Workflow
      continue-on-error: true
      run: |
        snakemake --lint -s output/workflow/Snakefile -d output || \
        echo 'There may have been a few warnings or errors. Please read through the log to determine if its harmless.'
